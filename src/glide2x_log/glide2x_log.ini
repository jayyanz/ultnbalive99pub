; glide2x_log settings. Put this file next to glide2x.dll.
[glide2x_log]
; affinity=game
;   The single-core compatibility shim pins every thread (including the AMD/NVIDIA
;   driver's own threads) to one CPU, which causes ~2.5 s freezes in matches.
;   With affinity=game the process gets all CPUs back and only the game's own
;   threads (and the WINMM timer thread that runs the game's timer callback) stay
;   on that one CPU. Remove the line, or this file, to leave affinity unchanged.
affinity=game
